<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: #08080c;
            color: #eeeef0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Atmospheric glow */
        .glow-top {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 500px;
            background: radial-gradient(
                ellipse at center,
                rgba(110, 142, 250, 0.1) 0%,
                rgba(110, 142, 250, 0.04) 40%,
                transparent 70%
            );
            pointer-events: none;
        }
        .glow-bottom {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(
                ellipse at center,
                rgba(196, 149, 106, 0.05) 0%,
                transparent 60%
            );
            pointer-events: none;
        }

        /* Safe zone guide (uncomment to debug) */
        /*
        .safe-zone {
            position: absolute;
            left: 285px;
            top: 0;
            width: 630px;
            height: 630px;
            border: 2px dashed rgba(255,0,0,0.3);
            pointer-events: none;
            z-index: 999;
        }
        */

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 28px;
        }

        /* Logo */
        .logo-icon {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            background: #0e0e14;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(110, 142, 250, 0.08);
        }
        .logo-icon svg {
            width: 88px;
            height: 88px;
        }

        h1 {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 72px;
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #eeeef0;
        }
        h1 em {
            font-style: italic;
            color: #6e8efa;
        }

        .desc {
            font-size: 22px;
            line-height: 1.5;
            color: #8888a0;
            max-width: 600px;
        }

        /* Browser strip */
        .browsers {
            display: flex;
            gap: 16px;
            margin-top: 8px;
        }
        .browser-dot {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .browser-dot img {
            width: 26px;
            height: 26px;
        }

        /* Connection lines behind browsers */
        .lines-wrap {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 80px;
            pointer-events: none;
        }
        .lines-wrap svg {
            width: 100%;
            height: 100%;
        }

        .meta {
            font-size: 15px;
            color: #55556a;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="glow-top"></div>
    <div class="glow-bottom"></div>
    <!-- <div class="safe-zone"></div> -->

    <div class="content">
        <div class="logo-icon">
            <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false"><path class="brand-route" d="M35.7 10L12.3 17L35.7 24L12.3 31L35.7 38" pathLength="100" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><circle class="brand-node" cx="35.7" cy="10" r="3.6" fill="currentColor" style="--d:0.60s"/><circle class="brand-node" cx="12.3" cy="17" r="3.6" fill="currentColor" style="--d:0.76s"/><circle class="brand-node" cx="35.7" cy="24" r="3.6" fill="currentColor" style="--d:0.92s"/><circle class="brand-node" cx="12.3" cy="31" r="3.6" fill="currentColor" style="--d:1.08s"/><circle class="brand-node" cx="35.7" cy="38" r="3.6" fill="currentColor" style="--d:1.24s"/></svg>
        </div>

        <h1>Browseway</h1>

        <p class="desc">Rule-based browser switching for macOS.<br>One URL in, the <em style="color:#6e8efa; font-style:italic; font-family:'Instrument Serif',serif;">right</em> browser out.</p>

        <div class="browsers">
            <div class="browser-dot"><img src="icons/safari.svg" alt="Safari"></div>
            <div class="browser-dot"><img src="icons/chrome.svg" alt="Chrome"></div>
            <div class="browser-dot"><img src="icons/firefox.svg" alt="Firefox"></div>
            <div class="browser-dot"><img src="icons/arc.svg" alt="Arc"></div>
            <div class="browser-dot"><img src="icons/edge.svg" alt="Edge"></div>
        </div>

        <p class="meta">browseway.app</p>
    </div>
</body>
</html>
